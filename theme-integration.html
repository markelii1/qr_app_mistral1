<script>
  (function() {
    'use strict';
    
    const THEME_KEY = 'theme-preference';
    const THEME_LIGHT = 'light';
    const THEME_DARK = 'dark';
    const THEME_SYSTEM = 'system';
    
    const html = document.documentElement;
    
    // Get stored or system preference
    function getStoredTheme() {
      return localStorage.getItem(THEME_KEY) || THEME_SYSTEM;
    }
    
    function getSystemTheme() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? THEME_DARK : THEME_LIGHT;
    }
    
    function getCurrentTheme() {
      const stored = getStoredTheme();
      return stored === THEME_SYSTEM ? getSystemTheme() : stored;
    }
    
    // Apply theme
    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
      
      // Update meta theme-color
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        meta.setAttribute('content', theme === THEME_DARK ? '#000000' : '#ffffff');
      }
      
      // Update toggle button
      updateToggleButton();
      
      // Dispatch event
      window.dispatchEvent(new CustomEvent('themechange', { detail: { theme } }));
    }
    
    // Toggle theme
    function toggleTheme() {
      const current = getCurrentTheme();
      const newTheme = current === THEME_LIGHT ? THEME_DARK : THEME_LIGHT;
      localStorage.setItem(THEME_KEY, newTheme);
      applyTheme(newTheme);
    }
    
    // Set specific theme
    function setTheme(theme) {
      if (theme === THEME_SYSTEM) {
        localStorage.removeItem(THEME_KEY);
        applyTheme(getSystemTheme());
      } else {
        localStorage.setItem(THEME_KEY, theme);
        applyTheme(theme);
      }
    }
    
    // Update toggle button UI
    function updateToggleButton() {
      const btn = document.querySelector('[data-theme-toggle]');
      if (!btn) return;
      
      const current = getCurrentTheme();
      const isDark = current === THEME_DARK;
      const sunIcon = btn.querySelector('.sun');
      const moonIcon = btn.querySelector('.moon');
      
      btn.setAttribute('aria-pressed', isDark);
      
      if (sunIcon && moonIcon) {
        sunIcon.style.display = isDark ? 'block' : 'none';
        moonIcon.style.display = isDark ? 'none' : 'block';
      }
    }
    
    // Initialize
    function init() {
      // Apply initial theme
      const theme = getCurrentTheme();
      applyTheme(theme);
      
      // Add click handler
      const btn = document.querySelector('[data-theme-toggle]');
      if (btn) {
        btn.addEventListener('click', toggleTheme);
        btn.setAttribute('role', 'button');
        btn.setAttribute('tabindex', '0');
        btn.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleTheme();
          }
        });
      }
      
      // Listen for system changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        const stored = getStoredTheme();
        if (stored === THEME_SYSTEM) {
          applyTheme(e.matches ? THEME_DARK : THEME_LIGHT);
        }
      });
      
      // Global API
      window.themeToggle = {
        toggle: toggleTheme,
        set: setTheme,
        get: getCurrentTheme,
        getStored: getStoredTheme,
        getSystem: getSystemTheme
      };
    }
    
    // Initialize on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
